<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" width="560" height="400" role="img" aria-label="In numbers: 5 years in field service, 13 services orchestrated in the capstone project, 3 infrastructure projects shipped">
  <defs>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <style>
      .h { font: 400 13px "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #22D3EE; letter-spacing: 3px; }
      .num { font: 700 46px "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .lab { font: 400 16px "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #94A3B8; }
    </style>
  </defs>

  <rect width="560" height="400" rx="16" fill="#0B1120"/>
  <rect x="0.5" y="0.5" width="559" height="399" rx="15.5" fill="none" stroke="#1E293B"/>

  <text class="h" x="40" y="58">IN NUMBERS</text>
  <rect x="40" y="74" width="44" height="3" rx="1.5" fill="url(#accent2)"/>

  <text class="num" x="40" y="165" fill="#67E8F9">05</text>
  <text class="lab" x="140" y="158">years in field service</text>
  <line x1="40" y1="190" x2="520" y2="190" stroke="#1E293B" stroke-width="1"/>

  <text class="num" x="40" y="255" fill="#7DD3FC">13</text>
  <text class="lab" x="140" y="248">services orchestrated</text>
  <line x1="40" y1="280" x2="520" y2="280" stroke="#1E293B" stroke-width="1"/>

  <text class="num" x="40" y="345" fill="#A5B4FC">03</text>
  <text class="lab" x="140" y="338">infrastructure projects</text>
</svg>
