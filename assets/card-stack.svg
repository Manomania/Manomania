<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 660" width="560" height="660" role="img" aria-label="Stack: Docker, Kubernetes, Argo CD, Nginx, Ansible, Vagrant, Bash, GitHub Actions, Prometheus, Grafana, Google Cloud, PostgreSQL, Linux, C, C++, Python, TypeScript">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <style>
      .h { font: 400 13px "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #22D3EE; letter-spacing: 3px; }
      .g { font: 400 12px "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #64748B; letter-spacing: 1.6px; }
      .i { font: 400 17.5px "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #E2E8F0; }
    </style>
  </defs>

  <rect width="560" height="660" rx="16" fill="#0B1120"/>
  <rect x="0.5" y="0.5" width="559" height="659" rx="15.5" fill="none" stroke="#1E293B"/>

  <text class="h" x="40" y="58">STACK</text>
