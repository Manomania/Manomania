  <circle cx="45" cy="135" r="3.5" fill="#22D3EE"/>
  <text class="g" x="60" y="140">CONTAINERS AND ORCHESTRATION</text>
  <text class="i" x="40" y="170">Docker &#183; Kubernetes &#183; Argo CD &#183; Nginx</text>

  <circle cx="45" cy="241" r="3.5" fill="#38BDF8"/>
